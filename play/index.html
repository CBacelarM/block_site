<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Block</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./favicon.png" />
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6451306130056697" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      @font-face {
        font-family: 'RetroPixels';
        src: url('assets/fonts/boldpixels.woff2') format('woff2'),
             url('assets/fonts/boldpixels.woff') format('woff'),
             url('assets/fonts/boldpixels.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'pixelsboldpixels';
        src: url('assets/fonts/boldpixels.woff2') format('woff2'),
             url('assets/fonts/boldpixels.woff') format('woff'),
             url('assets/fonts/boldpixels.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: block;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      html, body {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #070913;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #game-container {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        margin: auto;
        padding-top: var(--sat);
        padding-bottom: var(--sab);
        padding-left: var(--sal);
        padding-right: var(--sar);
        box-sizing: border-box;
      }
      canvas {
        display: block;
        margin: auto !important;
        touch-action: none;
      }
    </style>
    <script type="module" crossorigin src="./assets/index.js"></script>
  </head>
  <body>
    <div id="game-container"></div>
  </body>
</html>
